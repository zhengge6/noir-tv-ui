name: Feature request
description: Suggest a component, token or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Works with a TV remote (D-pad) as well as touch
        - label: Can be expressed in core CSS/JS, with thin React and Vue wrappers
