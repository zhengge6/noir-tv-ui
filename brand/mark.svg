<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="NOIR mark">
  <title>NOIR mark</title>
  <defs>
    <linearGradient id="nm-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18181A"/><stop offset="1" stop-color="#0A0A0B"/>
    </linearGradient>
    <linearGradient id="nm-red" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#8E040B"/><stop offset=".5" stop-color="#E50914"/><stop offset="1" stop-color="#FF5A62"/>
    </linearGradient>
    <mask id="nm-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/><circle cx="61.17" cy="61.17" r="32.5" fill="#000"/>
    </mask>
    <filter id="nm-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="nm-clip"><rect width="128" height="128" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#nm-clip)">
    <rect width="128" height="128" fill="url(#nm-tile)"/>
    <circle cx="64" cy="64" r="37" fill="#E50914" opacity=".42" mask="url(#nm-cut)" filter="url(#nm-blur)"/>
    <circle cx="64" cy="64" r="37" fill="url(#nm-red)" mask="url(#nm-cut)"/>
  </g>
  <rect x=".5" y=".5" width="127" height="127" rx="29.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
