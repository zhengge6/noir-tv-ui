<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <meta name="referrer" content="no-referrer">
  <title>WEX</title>
  <link rel="icon" href="data:,">

  <script>
    (function () {
      if (!Array.prototype.forEach) {
        Array.prototype.forEach = function (fn, thisArg) {
          for (var i = 0; i < this.length; i += 1) {
            if (i in this) fn.call(thisArg, this[i], i, this);
          }
        };
      }
      if (!Element.prototype.matches) {
        Element.prototype.matches = Element.prototype.webkitMatchesSelector || Element.prototype.msMatchesSelector;
      }
      if (!Element.prototype.closest) {
        Element.prototype.closest = function (selector) {
          var node = this;
          while (node && node.nodeType === 1) {
            if (node.matches && node.matches(selector)) return node;
            node = node.parentElement;
          }
          return null;
        };
      }
      if (!Element.prototype.replaceChildren) {
        Element.prototype.replaceChildren = function () {
          while (this.firstChild) this.removeChild(this.firstChild);
          for (var i = 0; i < arguments.length; i += 1) {
            this.appendChild(arguments[i]);
          }
        };
      }
      var cls = " webhome-ready";
      if (!("gap" in document.documentElement.style)) cls += " no-layout-gap";
      if (!window.CSS || !CSS.supports || !CSS.supports("top", "calc(1px + 1px)")) cls += " no-css-functions";
      if (!("aspectRatio" in document.documentElement.style)) cls += " no-aspect-ratio";
      try {
        if (window.fongmiClient && window.fongmiClient.isLeanback) cls += " tv";
      } catch (e) {}
      document.documentElement.className += cls;
    })();
  </script>
  <style>
    :root {
      --fm-web-height: 100vh;
      --fm-safe-top: 0px;
      --fm-safe-bottom: 0px;
      --safe-top: var(--fm-safe-top, 0px);
      --safe-bottom: var(--fm-safe-bottom, 0px);
      --active-safe-top: 0px;
      color-scheme: dark;
    }
    @supports (top: max(0px, 1px)) {
      :root {
        --safe-top: max(var(--fm-safe-top, 0px), env(safe-area-inset-top, 0px));
        --safe-bottom: max(var(--fm-safe-bottom, 0px), env(safe-area-inset-bottom, 0px));
      }
    }
    html.safe-top-active { --active-safe-top: var(--safe-top); }
    /* Solid Netflix-style canvas on purpose (the devkit only *recommends* transparent backgrounds). */
    html, body {
      min-height: var(--fm-web-height, 100vh);
      margin: 0;
      padding: 0;
      background: #141414;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC",
        "Source Han Sans SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    body { overflow-x: hidden; }
    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
    button:focus, input:focus { outline: none; }
    .app {
      min-height: var(--fm-web-height, 100vh);
      padding-bottom: 32px;
      padding-bottom: calc(32px + var(--safe-bottom));
    }

    /* ---------- top bar ---------- */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      height: 56px;
      padding: 0 4%;
      padding-top: var(--active-safe-top);
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-align-items: center; align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,.72) 10%, rgba(0,0,0,0));
    }
    .topbar:before {
      content: "";
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: #141414;
      opacity: 0;
      -webkit-transition: opacity .3s; transition: opacity .3s;
      z-index: -1;
    }
    .topbar.solid:before { opacity: 1; }
    .brand {
      color: #E50914;
      font-weight: 900;
      font-size: 30px;
      letter-spacing: -2px;
      line-height: 1;
      margin-right: 28px;
      -webkit-transform: scaleY(1.18); transform: scaleY(1.18);
      text-shadow: 0 2px 6px rgba(0,0,0,.45);
      white-space: nowrap;
    }
    .nav { display: none; }
    .nav button {
      color: #e5e5e5; font-size: 14px; margin-right: 20px; padding: 6px 0;
      -webkit-transition: opacity .2s; transition: opacity .2s;
    }
    .nav button.on { font-weight: 700; color: #fff; }
    .nav button:focus { color: #fff; }
    .spacer { -webkit-box-flex: 1; -webkit-flex: 1; flex: 1; }
    .search { position: relative; height: 34px; width: 34px; }
    .sbtn { position: absolute; right: 0; top: 0; width: 34px; height: 34px; z-index: 2; border-radius: 4px; }
    .sbtn svg { width: 22px; height: 22px; display: block; margin: 6px; fill: none; stroke: #fff; stroke-width: 2.2; }
    html.kbd .sbtn:focus, html.tv .sbtn:focus { box-shadow: 0 0 0 2px #fff; }
    .sinput {
      position: absolute; right: 0; top: 0;
      width: 230px; height: 34px;
      box-sizing: border-box;
      padding: 0 10px 0 38px;
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 2px;
      background: rgba(0,0,0,.82);
      color: #fff; font-size: 14px;
      opacity: 0;
      -webkit-transform: scaleX(.15); transform: scaleX(.15);
      -webkit-transform-origin: right center; transform-origin: right center;
      -webkit-transition: opacity .2s, -webkit-transform .25s; transition: opacity .2s, transform .25s;
      pointer-events: none;
      -webkit-appearance: none;
    }
    .search.open .sinput { opacity: 1; -webkit-transform: none; transform: none; pointer-events: auto; }
    .search.open .sbtn { right: 196px; }
    .sinput:focus { border-color: #fff; box-shadow: 0 0 0 1px #fff; }

    /* ---------- hero billboard ---------- */
    .hero {
      position: relative;
      height: 56.25vw;
      max-height: 86vh;
      min-height: 360px;
      overflow: hidden;
      background: #000;
    }
    .hero-bg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover; object-position: center top;
      opacity: 0;
      -webkit-transition: opacity .6s; transition: opacity .6s;
    }
    .hero-bg.ok { opacity: 1; }
    .hero-vig {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background:
        linear-gradient(180deg, rgba(20,20,20,0) 55%, rgba(20,20,20,.55) 75%, #141414 98%),
        linear-gradient(77deg, rgba(0,0,0,.82) 0, rgba(0,0,0,.45) 30%, rgba(0,0,0,0) 62%);
    }
    .hero-body {
      position: absolute;
      left: 4%; bottom: 30%;
      width: 40%;
      z-index: 2;
    }
    .hero-tag {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-align-items: center; align-items: center;
      font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #fff; margin-bottom: 12px;
    }
    .hero-tag .nlogo {
      color: #E50914; font-family: "WEXTitle", -apple-system, "PingFang SC", sans-serif;
      font-size: 24px; font-weight: 400; letter-spacing: 1px; line-height: 1; margin-right: 12px;
    }
    .hero-tag .cat { font-size: 16px; font-weight: 700; letter-spacing: 3px; }
    .hero-tag .t10 {
      display: inline-block; background: #E50914; color: #fff; font-size: 9px; line-height: 1;
      padding: 4px 3px 3px; border-radius: 2px; margin-right: 8px; text-align: center; font-weight: 900;
    }
    .hero-tag .t10 b { display: block; font-size: 13px; }
    .hero-title {
      margin: 0 0 34px;
      font-size: 58px;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,.6);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hero-meta { font-size: 15px; color: #fff; margin-bottom: 10px; text-shadow: 1px 1px 4px rgba(0,0,0,.6); }
    .hero-meta .score { color: #46d369; font-weight: 700; margin-right: 10px; }
    .hero-meta .pill { display: inline-block; border: 1px solid rgba(255,255,255,.4); padding: 0 6px; margin-right: 10px; font-size: 12px; line-height: 18px; }
    .hero-desc {
      margin: 0 0 24px;
      font-size: 17px; line-height: 1.55; color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,.7);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hero-btns { white-space: nowrap; }
    .btn {
      display: inline-block;
      height: 42px; line-height: 42px;
      padding: 0 26px 0 22px;
      border-radius: 4px;
      font-size: 17px; font-weight: 700;
      margin-right: 10px;
      -webkit-transition: -webkit-transform .15s, opacity .15s; transition: transform .15s, opacity .15s;
    }
    .btn i { font-style: normal; display: inline-block; margin-right: 8px; font-size: 18px; }
    .btn-play { background: #fff; color: #000; }
    .btn-info { background: rgba(109,109,110,.72); color: #fff; }
    .btn:active { opacity: .75; }
    html.kbd .btn:focus, html.tv .btn:focus { -webkit-transform: scale(1.06); transform: scale(1.06); box-shadow: 0 0 0 3px #141414, 0 0 0 5px #fff; }
    @media (hover: hover) {
      .btn-play:hover { opacity: .8; }
      .btn-info:hover { opacity: .8; }
    }

    /* ---------- rows ---------- */
    .rows { position: relative; z-index: 3; margin-top: -9vw; }
    .row { margin-bottom: 6px; }
    .row[hidden] { display: none; }
    .row-title {
      margin: 0 4%;
      font-size: 20px; font-weight: 700; color: #e5e5e5;
      line-height: 1.3;
    }
    .row-title small { font-size: 12px; font-weight: 400; color: #808080; margin-left: 8px; }
    /* v2e item 4b: 收藏 heart next to the first visible row title */
    .hfav { display: inline-block; vertical-align: middle; position: relative; width: 30px; height: 30px; margin: -4px 0 0 10px; padding: 0; border-radius: 50%; background: rgba(255,255,255,.12); -webkit-transition: background .2s, -webkit-transform .2s; transition: background .2s, transform .2s; }
    .hfav[hidden] { display: none; }
    .apptag { position: absolute; left: 8px; bottom: 8px; z-index: 3; padding: 1px 7px; border-radius: 999px; font-size: 10px; line-height: 15px; font-weight: 700; color: #141414; background: rgba(255,255,255,.88); pointer-events: none; }
    .favsec { width: 100%; margin: 6px 0 10px; font-size: 13px; color: #8c8c8c; }
    /* v2e 6c: shared management mode (继续观看 / 收藏) */
    .rmng { float: right; margin: 2px 4% 0 0; padding: 3px 12px; border-radius: 999px; font-size: 13px; font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif; letter-spacing: 0; color: #cfcfcf; background: rgba(255,255,255,.1); }
    .row-title .rmng { margin-right: 0; }
    @media (hover: hover) { .rmng:hover { background: rgba(255,255,255,.22); color: #fff; } }
    html.kbd .rmng:focus, html.tv .rmng:focus { background: #fff; color: #141414; }
    .mitem { position: relative; }
    .mcard { display: block; width: 100%; text-align: left; }
    .mcard .poster { -webkit-transition: -webkit-transform .18s, opacity .18s; transition: transform .18s, opacity .18s; }
    .mcard.on .poster { opacity: .82; }
    html.kbd .mcard:focus .poster, html.tv .mcard:focus .poster { -webkit-transform: scale(1.05); transform: scale(1.05); box-shadow: 0 0 0 3px #fff, 0 12px 28px rgba(0,0,0,.6) !important; }
    .mchk { position: absolute; top: 8px; left: 8px; z-index: 3; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.9); background: rgba(0,0,0,.35); color: #fff; font-size: 13px; line-height: 22px; text-align: center; font-weight: 700; }
    .mcard.on .mchk { background: #E50914; box-shadow: none; }
    .mname { display: block; margin-top: 6px; font-size: 12px; color: #b3b3b3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mx { position: absolute; top: -7px; right: -7px; z-index: 4; width: 28px; height: 28px; border-radius: 50%; background: rgba(30,30,30,.92); color: #fff; font-size: 16px; line-height: 28px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.25); }
    @media (hover: hover) { .mx:hover { background: #E50914; } }
    html.kbd .mx:focus, html.tv .mx:focus { background: #E50914; -webkit-transform: scale(1.15); transform: scale(1.15); box-shadow: 0 0 0 2px #fff; }
    .cfm { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 120; background: rgba(0,0,0,.6); display: -webkit-box; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
    .cfm[hidden] { display: none; }
    .cfm-box { width: 84%; max-width: 360px; padding: 22px 20px 16px; border-radius: 20px; background: rgba(38,38,40,.97); box-shadow: 0 20px 50px rgba(0,0,0,.6); text-align: center; }
    .cfm-box p { margin: 0 0 18px; font-size: 16px; line-height: 1.5; color: #eee; }
    .cfm-btns .btn { margin: 0 6px; }
    /* v2e item 6: red dots for favourites with new episodes */
    #navFav { position: relative; }
    .ndot { display: none; position: absolute; top: 3px; right: 1px; width: 8px; height: 8px; border-radius: 50%; background: #E50914; box-shadow: 0 0 0 2px rgba(20,20,20,.85); }
    .has-upd .ndot { display: block; }
    .hfav .ndot { top: -1px; right: -1px; }
    .udot { position: absolute; top: 7px; left: 7px; z-index: 3; padding: 2px 8px 2px 6px; border-radius: 999px; font-size: 11px; line-height: 16px; color: #fff; background: rgba(229,9,20,.92); box-shadow: 0 2px 8px rgba(0,0,0,.35); pointer-events: none; }
    .udot i { display: inline-block; width: 6px; height: 6px; margin: 0 4px 1px 0; border-radius: 50%; background: #fff; vertical-align: middle; }
    .hfav svg { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2;
      -webkit-transform: translate(-50%, -50%); transform: translate(-50%, -50%); }
    .hfav.has svg { fill: #E50914; stroke: #E50914; }
    @media (hover: hover) { .hfav:hover { background: rgba(255,255,255,.24); } }
    html.kbd .hfav:focus, html.tv .hfav:focus { background: #fff; -webkit-transform: scale(1.12); transform: scale(1.12); box-shadow: 0 0 0 3px rgba(255,255,255,.35); }
    html.kbd .hfav:focus svg, html.tv .hfav:focus svg { stroke: #E50914; }
    .row-wrap { position: relative; }
    .row-scroll {
      position: relative;
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      padding: 14px 0 26px 4%;
      scrollbar-width: none;
    }
    .row-scroll::-webkit-scrollbar { display: none; }
    .track {
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-flex-wrap: nowrap; flex-wrap: nowrap;
      -webkit-align-items: flex-end; align-items: flex-end;
    }
    .track .end { -webkit-flex: none; flex: none; width: 4vw; height: 1px; }
    .arrow {
      display: none;
      position: absolute; top: 14px; bottom: 26px;
      width: 4%; z-index: 6;
      background: rgba(20,20,20,.55);
      color: #fff; font-size: 44px; line-height: 1;
      opacity: 0;
      -webkit-transition: opacity .2s; transition: opacity .2s;
    }
    .arrow.l { left: 0; border-radius: 0 4px 4px 0; }
    .arrow.r { right: 0; border-radius: 4px 0 0 4px; }
    .arrow span { display: inline-block; -webkit-transition: -webkit-transform .2s; transition: transform .2s; }
    .arrow:hover span { -webkit-transform: scale(1.25); transform: scale(1.25); }
    @media (min-width: 900px) and (hover: hover) {
      .arrow { display: block; }
      .row-wrap:hover .arrow { opacity: 1; }
      .arrow.hide, .row-wrap:hover .arrow.hide { opacity: 0; pointer-events: none; }
    }
    html.tv .arrow { display: none; }

    /* ---------- cards ---------- */
    .card {
      position: relative;
      -webkit-flex: none; flex: none;
      display: block;
      width: 15vw;
      margin-right: 8px;
      text-align: left;
      z-index: 1;
    }
    .poster {
      position: relative;
      display: block;
      height: 0;
      padding-top: 133.333%;
      border-radius: 4px;
      overflow: hidden;
      background: #2a2a2a;
      -webkit-transition: -webkit-transform .22s ease-out; transition: transform .22s ease-out;
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    .poster img {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      -webkit-transition: opacity .35s; transition: opacity .35s;
    }
    .poster img.ok { opacity: 1; }
    .poster .ph {
      position: absolute; left: 8px; right: 8px; bottom: 10px;
      color: #8c8c8c; font-size: 12px; line-height: 1.3; font-weight: 700;
    }
    .glow {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 4px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.95);
      opacity: 0;
      -webkit-transition: opacity .2s; transition: opacity .2s;
      pointer-events: none;
    }
    .mini {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 26px 8px 9px;
      background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.88) 45%);
      opacity: 0;
      -webkit-transition: opacity .2s; transition: opacity .2s;
    }
    .mini b { display: block; font-size: 13px; line-height: 1.3; color: #fff; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .mini em { display: block; font-style: normal; font-size: 11px; color: #bcbcbc; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .mini em.last { color: #ff5a63; font-weight: 700; }
    .shadow {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      border-radius: 4px;
      box-shadow: 0 10px 22px rgba(0,0,0,.75);
      opacity: 0;
      -webkit-transition: opacity .22s; transition: opacity .22s;
    }
    .prog {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 3px; background: rgba(90,90,90,.9); z-index: 2;
    }
    .prog i {
      display: block; height: 100%; background: #E50914;
      -webkit-transform-origin: left center; transform-origin: left center;
    }
    .cap { display: none; }
    /* watch markers (local only): progress bar from the app history / 已看完 tag from local marks */
    .wbar { position: absolute; left: 9px; right: 9px; bottom: 8px; height: 3px; border-radius: 999px; background: rgba(255,255,255,.28); z-index: 3; overflow: hidden; pointer-events: none; }
    .wbar i { display: block; height: 100%; border-radius: 999px; background: #E50914; }
    .wdone { position: absolute; top: 7px; right: 7px; z-index: 3; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; line-height: 20px; text-align: center; font-weight: 700; color: #46d369; background: rgba(20,20,20,.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); pointer-events: none; }
    .card:focus .wbar, .card:hover .wbar { opacity: 0; }
    html.kbd .card:focus, html.tv .card:focus { z-index: 5; }
    html.kbd .card:focus .poster, html.tv .card:focus .poster { -webkit-transform: scale(1.08); transform: scale(1.08); }
    html.kbd .card:focus .glow, html.kbd .card:focus .mini, html.kbd .card:focus .shadow,
    html.tv .card:focus .glow, html.tv .card:focus .mini, html.tv .card:focus .shadow { opacity: 1; }
    @media (hover: hover) {
      .card:hover { z-index: 5; }
      .card:hover .poster { -webkit-transform: scale(1.08); transform: scale(1.08); }
      .card:hover .mini, .card:hover .shadow { opacity: 1; }
    }
    .card.skel .poster { -webkit-animation: pulse 1.2s ease-in-out infinite; animation: pulse 1.2s ease-in-out infinite; }
    @-webkit-keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    /* continue watching: progress line sits under the poster art */
    .card-cw .mini { padding-bottom: 12px; }

    /* Top 10: big outlined numerals beside the posters */
    .card-top {
      width: 24vw;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-align-items: flex-end; align-items: flex-end;
    }
    .card-top .rank {
      -webkit-flex: none; flex: none;
      width: 9vw;
      margin-right: -1.2vw;
      text-align: right;
      font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 17vw;
      line-height: .76;
      letter-spacing: -1.4vw;
      color: #141414;
      -webkit-text-stroke: 3px #5c5c5c;
      text-shadow: none;
      position: relative; z-index: 0;
      -webkit-user-select: none; user-select: none;
    }
    .card-top.r10 { width: 28.5vw; }
    .card-top.r10 .rank { width: 13.5vw; letter-spacing: -2.2vw; }
    .card-top .poster-box { -webkit-flex: none; flex: none; width: 15vw; position: relative; z-index: 1; }

    /* search results */
    .results { padding: 76px 4% 20px; padding-top: calc(76px + var(--active-safe-top)); }
    .results[hidden], .main[hidden] { display: none; }
    .results h2 { margin: 0 0 6px; font-size: 18px; color: #e5e5e5; font-weight: 700; }
    .results .note { color: #808080; font-size: 13px; margin-bottom: 12px; }
    .grid { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-right: -8px; }
    .grid .card { width: 15.4%; margin: 0 1.2% 22px 0; }

    /* toast + browser hint */
    .toast {

  <script>
  (function () {
    "use strict";
    /* WEX WebHome: Douban public lists (fetched in-app via fm.req, Referer set natively) + the app's own search.
       Nothing here is played or proxied by our server: 搜索播放 hands the title to fm.search (native search across all
       sites in the config), 继续观看 reopens the native source via fm.vod. Plain browsers fall back to ../db and ../img
       (small cached nginx relays) only so the page can be previewed. All paths are relative, no host is hard-coded. */
    var DB = "https://m.douban.com/rexxar/api/v2/";
    var REF = "https://movie.douban.com/";
    var UA = "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36";
    var root = document.documentElement;
    var $ = function (id) { return document.getElementById(id); };

    var HIST = {}, HIST_N = {};   // history key -> entry; normalised name -> entry (watch badges)
    var featured = null, searchMode = false, modalItem = null, lastFocus = null, lastFocusMemo = null, lastKw = "";
    /* TV / 10-foot mode: leanback client, TV user agent, ?tv=1, or a wide screen with neither touch nor a mouse */
    function detectTV() {

      if (/[?&]tv=1(&|$)/.test(q)) return true;
      try { if (window.fongmiClient && window.fongmiClient.isLeanback) return true; } catch (e) {}
      if (/Android ?TV|Google ?TV|BRAVIA|\bAFT[A-Z]|MiTV|MIBOX|HiTV|SmartTV|SMART-TV|Tizen|Web0S|WebOS|NetCast|HbbTV|Leanback|CrKey/i.test(ua)) return true;
      var mm = function (x) { try { return !!(window.matchMedia && window.matchMedia(x).matches); } catch (e) { return false; } };
      var touch = ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;
      var mouse = mm("(any-pointer: fine)") || mm("(pointer: fine)") || mm("(any-hover: hover)");
      var w = window.innerWidth || 0, h = window.innerHeight || 0;
      return w >= 900 && w > h && !touch && !mouse;
    }
    if (detectTV() && !/(^|\s)tv(\s|$)/.test(root.className)) root.className += " tv";
    var loadQueue = [], loading = 0, MAXLOAD = /(^|\s)tv(\s|$)/.test(root.className) ? 4 : 6;

    function isTV() { return /(^|\s)tv(\s|$)/.test(root.className); }
    function hasFm() { return !!(window.fm && typeof window.fm.req === "function"); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function clean(s) { return String(s == null ? "" : s).replace(/[\u200b-\u200f\u202a-\u202e\u2060\ufeff]/g, "").replace(/\s+/g, " ").trim(); }
    function normName(s) { return clean(s).toLowerCase().replace(/[\s·・:：,，.。!！?？'"“”‘’()（）\[\]【】《》<>\-—_~～]/g, ""); }
    function baseTitle(s) {   // 花儿与少年 第八季 -> 花儿与少年 ; 阿凡达：水之道 -> 阿凡达 (offered as a second search)
      var t = clean(s).replace(/\s*(第[一二三四五六七八九十百零\d]+[季部]|season\s*\d+|S\d+)\s*$/i, "");

    }

    /* ---------- SDK readiness: the bridge is injected at onPageFinished, so wait briefly for it ---------- */
    var READY = false, readyCbs = [];
    function whenReady(cb) { if (READY) cb(); else readyCbs.push(cb); }

    function readRootPixel(name) {

    }

      if (isNaN(sb)) sb = readRootPixel("--fm-status-bar-height");

    }

      d = d || {};
      if (d.chromeMode) state.chromeMode = String(d.chromeMode).toLowerCase();

    /* ---------- network ---------- */
    function getJSON(url, tries) {
      tries = tries == null ? 1 : tries;
      var p = new Promise(function (resolve, reject) {

        throw e;
      });
    }
    /* Douban JSON: in the app via fm.req (native OkHttp, Referer header, no CORS); plain browsers via ../db (cached relay) */
    function dbFetch(path) {
      return readyP().then(function () { return dbFetchNow(path); });
    }
    function dbFetchNow(path) {
      if (!hasFm()) return getJSON("../db/" + path, 1);
      return Promise.resolve().then(function () {
        return fm.req(DB + path, { method: "GET", headers: { "Referer": REF, "User-Agent": UA, "Accept": "application/json" }, responseType: "text", timeout: 15 });
      }).then(function (r) {
        if (!r || !r.ok) throw new Error((r && (r.error || r.status)) || "fm.req");

    var MEMC = {};

    function lcSet(k, d, t) {
      var o = { t: t || Date.now(), d: d };
      MEMC[k] = o;
      try { localStorage.setItem("wexc:" + k, JSON.stringify(o)); } catch (e) { lcTrim(); }
    }

      if (featured || !HERO_POOL.length) return;
      var fresh = HERO_POOL.filter(function (x) { return !MARKS[x.v.id]; }), base = fresh.length ? fresh : HERO_POOL;
      var good = base.filter(function (x) { return x.v.rate >= 7.5; }), pool = good.length >= 3 ? good : base;
      var x = heroRand(pool) || pool[0];
      setHero(x.v, x.tag);
      heroStageNext(7000);
      heroRotate();
    }
    function loadRow(row) {
      var df = row.def;
      return dbList(df.spec, 0, df.cnt, function (d) {   // background refresh of a stale cached list
        row.data = d.items; row.total = d.total || d.items.length;
        if (df.hero) heroAdd(d.items, df.hero);
        schedHome();
      }).then(function (d) {
        row.loaded = true;
        row.data = d.items;
        row.start = df.cnt;
        row.total = d.total || d.items.length;
        if (df.paged && row.start < Math.min(row.total, 150)) row.more = function () { rowMore(row); };
        if (df.hero) heroAdd(d.items, df.hero);
        schedHome();
      }).catch(function () {
        row.loaded = true; row.data = [];
        row.track.innerHTML = '<div class="hint">' + esc(df.title) + " 加载失败</div>";
        row.el.hidden = false;
      }).then(function () {
        if (df.hero) { heroWait -= 1; if (heroWait <= 0) heroPick(); }
      });
    }
    function bootRows() {
      var q = [];
      for (var i = 0; i < ROW_ORDER.length; i += 1) { var r = ROWS[ROW_ORDER[i]]; if (r.def && r.def.spec) { q.push(r); if (r.def.hero) heroWait += 1; } }
      var active = 0;
      function next() {
        while (active < 3 && q.length) {
          active += 1;
          loadRow(q.shift()).then(function () { active -= 1; next(); });
        }
      }
      next();
    }

    /* ---------- boot ---------- */
    refreshSafeAreaMode();
    if (hasFm()) onSdk();
    else setTimeout(function () { if (!READY) { setReady(); loadLocal(); } }, inApp() ? 4000 : 350);
    (function () {   // cached lists render immediately (images wait for the SDK); otherwise wait for readiness
      var d0 = HOME_DEFS[0];
      if (lcGet("l2:" + specPath(d0.spec, 0, d0.cnt))) bootRows(); else whenReady(bootRows);
    })();
    heroPoolStart();   // widen the hero catalog in the background (SWR-cached, serial, gentle)
    setTimeout(function () {
      if (!hasFm()) {
        var h = $("hint");
        h.innerHTML = "<b>浏览模式</b>：可浏览片单与搜索。在 webhtv App 中把本配置设为首页即可「搜索播放」、显示「继续观看」。";
        h.hidden = false;
      }
    }, 1500);
    if (isTV()) setTimeout(function () { if (!document.activeElement || document.activeElement === document.body) focusEl($("heroPlay")); }, 300);
    setTimeout(schedulePump, 50);
  })();
  </script>
</body>
